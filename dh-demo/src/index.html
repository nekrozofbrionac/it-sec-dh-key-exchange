<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>DH-Demo</title>
    <script src="index.js"></script>
    <style>
        body {
            font-family: sans-serif;
            display: flex;
            justify-content: center;
        }

        .outer {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 1em;
            width: 70em;
            min-height: 5em;
        }

        .container {
            display: flex;
            flex-direction: column;
            gap: 1em;
            align-items: stretch;
        }

        .channel-message {
            width: 100%;
            border: 1px solid lightgray;
            border-radius: 5px;
            padding: 0.5em;
        }

        .config-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            grid-auto-rows: 3em ;
            gap: 1em;
            justify-items: stretch;
        }

        .input-field {
            display: flex;
            flex-direction: column;
        }

    </style>
</head>
<body>
<div class="outer">
    <h1>DH-Demo</h1>
    <div class="config-grid">
        <div class="input-field">
            <label for="createChannelGenerator">Generator</label>
            <input type="number" id="createChannelGenerator"/>
        </div>
        <div class="input-field">
            <label for="createChannelPrime">Primzahl</label>
            <input type="number" id="createChannelPrime"/>
        </div>
        <button id="createChannel">Kanal erstellen</button>
        <div class="input-field">
            <label for="createPartnerName">Name</label>
            <input type="text" id="createPartnerName"/>
        </div>
        <div class="input-field">
            <label for="createPartnerSk">Privater Schlüssel</label>
            <input type="number" id="createPartnerSk"/>
        </div>
        <button id="createPartner">Partner hinzufügen</button>
        <div>
            <!--empty for grid lol-->
        </div>
        <button id="establishSecret">Geheimnis errechnen</button>
    </div>
    <h3>
        Kommunikationskanal
    </h3>
    <div class="container" id="channelContainer">
    </div>
    <h3>Partner (und deren Geheimnisse)</h3>
    <div class="container" id="partnerContainer">
    </div>
    <h3>Öffentliche Nachrichten</h3>
    <div class="container" style="width: 100%" id="channelMessageContainer">
    </div>
    <div style="height:5em">
        <!--empty for spacing-->
    </div>
</div>
</body>
</html>
