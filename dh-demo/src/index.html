<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>DH-Demo</title>
    <script src="index.js"></script>
    <style>
        body {
            font-family: sans-serif;
            display: flex;
            justify-content: center;
        }

        .outer {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 1em;
            width: 70em;
            min-height: 5em;
        }

        .container {
            display: flex;
            flex-direction: column;
            gap: 1em;
            align-items: stretch;
        }

        .channel-message {
            width: 100%;
            border: 1px solid lightgray;
            border-radius: 5px;
            padding: 0.5em;
            display: flex;
            flex-direction: row;
            gap: 1em;
        }
        .channel-message > div {
            flex: 1;
        }

        .config-grid {
            width: 100%;
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            grid-auto-rows: 3em ;
            gap: 1em;
            justify-items: stretch;
        }

        .input-field {
            display: flex;
            flex-direction: column;
        }

        #partnerContainer > div {
            border: 1px solid lightgray;
            border-radius: 5px;
            padding: 0.5em;

            display:flex;
            gap: 1em;
        }
        #partnerContainer > div > div {
            flex: 1
        }
        #partnerContainer > div > button {
            min-width: 10em;
        }

        #currentTabContainer {
            display: flex;
            gap: 1em;
        }

    </style>
</head>
<body>
<div class="outer">
    <h1>DH-Demo</h1>
    <div class="config-grid">
        <div class="input-field">
            <label for="createPartnerName">Name</label>
            <input type="text" id="createPartnerName"/>
        </div>
        <div class="input-field">
            <label for="createPartnerSk">Privater Schlüssel</label>
            <input type="number" id="createPartnerSk"/>
        </div>
        <button id="createPartner">Partner hinzufügen</button>
    </div>
    <h3>Kommpartner</h3>
    <div class="container" style="width: 100%" id="partnerContainer">
        Swag
    </div>
    <h3>Nachrichten</h3>
    <div style="width: 100%" id="currentTabContainer">
        <!-- Öffentliche kanäle -->
        <!-- tabs -->
        <!-- tabs -->
    </div>
    <div class="container" style="width: 100%" id="messageContainer">
    </div>
    <div style="height:5em">
        <!--empty for spacing-->
    </div>
</div>
</body>
</html>
